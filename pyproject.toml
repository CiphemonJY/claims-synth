[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-synth"
version = "0.1.0"
description = "Synthetic healthcare claim generator + rules-based payer adjudicator for denial-risk modeling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]
authors = [
    {name = "James Yeung"},
]

[project.optional-dependencies]
# Backs the default predictor behind the scorecard's ML-utility (TRTR/TSTR)
# column. Without it that one column is skipped with a message; every other
# part of the package runs on numpy alone.
scorecard = [
    "lightgbm>=4.0",
    "pandas>=1.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "lightgbm>=4.0",
    "pandas>=1.5",
]

[project.scripts]
claims-synth = "claims_synth.generate:main"
claims-synth-scorecard = "claims_synth.scorecard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"claims_synth.scorecard" = ["data/*.json"]
